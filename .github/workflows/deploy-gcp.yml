name: Deploy to GCP Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    env:
      NODE_ENV: production
      PORT: 8080

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build app
        run: npm run build

      - name: Authenticate with GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Configure gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Build and push image
        run: |
          docker build -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/wardrobe-selector:${{ github.sha }} .
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/wardrobe-selector:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy wardrobe-selector \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/wardrobe-selector:${{ github.sha }} \
            --platform managed \
            --region us-central1 \
            --allow-unauthenticated \
            --set-env-vars NODE_ENV=production,PORT=8080 \
            --set-env-vars GOOGLE_CLOUD_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }} \
            --set-secrets GOOGLE_CLOUD_API_KEY=google-cloud-api-key:latest

      - name: Smoke test Cloud Run health endpoint
        run: |
          SERVICE_URL=$(gcloud run services describe wardrobe-selector --region us-central1 --format='value(status.url)')
          echo "Service URL: $SERVICE_URL"
          curl -fsS "$SERVICE_URL/api/health"
