name: Test and deploy to GCP Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      PROJECT_ID: gen-lang-client-0467142337
      REGION: europe-west1
      SERVICE_NAME: wardrobe-selector

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Configure Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/wardrobe-selector/wardrobe-selector:${GITHUB_SHA}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy Cloud Run
        run: |
          gcloud run deploy "$SERVICE_NAME" \
            --image "$IMAGE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --allow-unauthenticated \
            --service-account "wardrobe-run-sa@${PROJECT_ID}.iam.gserviceaccount.com" \
            --set-env-vars "NODE_ENV=production,GOOGLE_CLOUD_PROJECT_ID=$PROJECT_ID,GOOGLE_CLOUD_STORAGE_BUCKET=wardrobe-uploads-$PROJECT_ID,GOOGLE_CLOUD_ENABLED=true,GOOGLE_CLOUD_MODEL=gemini-1.5-flash,DATA_STORE=firestore,FIRESTORE_DATABASE_ID=onesec" \
            --set-secrets "GOOGLE_CLOUD_API_KEY=google-cloud-api-key:latest,ADMIN_USERNAME=wardrobe-admin-username:latest,ADMIN_PASSWORD=wardrobe-admin-password:latest,ADMIN_JWT_SECRET=wardrobe-admin-jwt-secret:latest" \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 2 \
            --timeout 300 \
            --quiet

      - name: Smoke test health endpoint
        run: |
          SERVICE_URL=$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')
          curl --fail --show-error --silent "$SERVICE_URL/api/health"
